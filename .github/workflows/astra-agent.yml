name: astra-agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node astra-agent.mjs
        env:
          AGENT_ID: ${{ vars.AGENT_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      - name: Commit ledger update
        run: |
          git config user.name "astra-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger-*.json
          git diff --cached --quiet || git commit -m "ledger update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push